[project]
name = "andy-companion"
version = "0.1.0"
description = "A home companion robot on Reachy Mini, with NVIDIA Nemotron on Nebius Token Factory"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/andy_companion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
