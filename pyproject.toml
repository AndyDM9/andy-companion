[project]
name = "andy-companion"
version = "0.1.0"
description = "A home companion robot on Reachy Mini, with NVIDIA Nemotron on Nebius Token Factory"
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "AndyDM9" }]
requires-python = ">=3.12,<3.13"
keywords = ["reachy-mini", "robot", "companion", "nemotron", "nebius", "tavily", "older-adults"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Home Automation",
]
dependencies = []

[project.urls]
Repository = "https://github.com/AndyDM9/andy-companion"

[project.optional-dependencies]
# Everything the robot side needs (the Reachy Mini dashboard app installs this).
robot = [
    "reachy-mini==1.12.0rc1",
    "reachy_mini_conversation_app @ git+https://github.com/pollen-robotics/reachy_mini_conversation_app@v1.0.1",
    "opencv-python-headless>=4.10,<5",
    "vosk>=0.3.45,<0.4",
    "numpy>=1.26",
    "segno>=1.6,<2",
]

[dependency-groups]
dev = ["pytest>=8", "numpy>=1.26", "opencv-python-headless>=4.9", "segno>=1.6,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/andy_companion"]

[tool.hatch.build.targets.wheel.force-include]
# Andy's voice tools and profile travel with the package (andy_companion.app_mode.data_dir).
"tools" = "andy_companion/_data/tools"
"profiles" = "andy_companion/_data/profiles"

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff.lint]
# Errors, not style: undefined names, unused imports and variables, syntax errors, and bugbear's likely bugs.
# zip() without strict= is allowed: its only uses are in tests, mostly pairing neighbours (zip(x, x[1:])).
select = ["F", "E9", "B"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest-tmp"
