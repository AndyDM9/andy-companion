<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Atkinson Hyperlegible, Verdana, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How Andy works</title>
  <desc id="d">The person talks to Andy on a Reachy Mini. On the home computer: the voice server, where NVIDIA Parakeet hears, Silero VAD and Smart Turn tell when the person has finished, and Qwen3-TTS speaks, and where code makes a tool call the model wrote as text and adds Andy's own note to a turn that needs a memory offer, the clock or the camera; Andy's app with its 40 tools (34 of its own and six of Pollen's), body behaviours, the urgent-words net, privacy, the supervisor and the screen server; and, on this computer and offline, NVIDIA Cosmos Reason 2 for local vision (conversation still needs Token Factory), Vosk for the wake phrase, Tesseract to read letters and YuNet to find a face to follow. On Nebius: Token Factory runs NVIDIA Nemotron 3.5 Lightning for talk and tools, Nemotron 3.5 Super VL for the eyes and Nemotron 3 Ultra for hard questions; a Serverless Endpoint runs Nemotron 3.5 Content Safety as a second look (and Nano 12B v2 VL as other eyes, if chosen); Serverless Jobs run the tests and Andy's search in simulation. Tavily brings the web. A screen beside Andy and a family page on a phone show what Andy found and what was shared.</desc>
  <rect width="1200" height="700" fill="#f7faf8"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4c5d4f"/></marker>
  </defs>

  <!-- the home -->
  <rect x="24" y="24" width="640" height="652" rx="14" fill="#e7eee3" stroke="#cbd8c6"/>
  <text x="44" y="60" font-size="22" font-weight="700" fill="#1d2a1f">At home</text>

  <rect x="48" y="84" width="180" height="96" rx="10" fill="#fff" stroke="#2f6f5e" stroke-width="2"/>
  <text x="138" y="122" font-size="18" font-weight="700" text-anchor="middle" fill="#1d2a1f">The person</text>
  <text x="138" y="148" font-size="15" text-anchor="middle" fill="#4c5d4f">speaks, listens, holds</text>
  <text x="138" y="168" font-size="15" text-anchor="middle" fill="#4c5d4f">up a letter</text>

  <rect x="296" y="84" width="340" height="96" rx="10" fill="#fff" stroke="#2f6f5e" stroke-width="2"/>
  <text x="466" y="118" font-size="18" font-weight="700" text-anchor="middle" fill="#1d2a1f">Reachy Mini</text>
  <text x="466" y="144" font-size="15" text-anchor="middle" fill="#4c5d4f">microphones, camera, speaker,</text>
  <text x="466" y="164" font-size="15" text-anchor="middle" fill="#4c5d4f">head, antennas, body</text>
  <line x1="228" y1="132" x2="294" y2="132" stroke="#4c5d4f" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>

  <rect x="48" y="212" width="588" height="330" rx="10" fill="#fff" stroke="#cbd8c6"/>
  <text x="68" y="244" font-size="18" font-weight="700" fill="#1d2a1f">The home computer</text>

  <rect x="68" y="262" width="250" height="110" rx="8" fill="#f4f7f1" stroke="#cbd8c6"/>
  <text x="84" y="290" font-size="16" font-weight="700" fill="#1d2a1f">Voice server</text>
  <text x="84" y="314" font-size="15" fill="#1d2a1f">NVIDIA Parakeet (hearing)</text>
  <text x="84" y="336" font-size="15" fill="#1d2a1f">Silero VAD, Smart Turn (turns)</text>
  <text x="84" y="358" font-size="15" fill="#1d2a1f">Qwen3-TTS (speaking)</text>

  <rect x="342" y="262" width="274" height="270" rx="8" fill="#f4f7f1" stroke="#cbd8c6"/>
  <text x="358" y="290" font-size="16" font-weight="700" fill="#1d2a1f">Andy's app</text>
  <text x="358" y="314" font-size="15" fill="#1d2a1f">40 tools: day, reminders, letters,</text>
  <text x="358" y="336" font-size="15" fill="#1d2a1f">news, stories, jokes, photos, family</text>
  <text x="358" y="358" font-size="15" fill="#1d2a1f">body: follows you, finds things</text>
  <text x="358" y="380" font-size="15" fill="#1d2a1f">urgent-words net (911, 988)</text>
  <text x="358" y="402" font-size="15" fill="#1d2a1f">privacy: nothing said is logged</text>
  <text x="358" y="424" font-size="15" fill="#1d2a1f">supervisor: asleep, quiet, wake</text>
  <text x="358" y="446" font-size="15" fill="#1d2a1f">in code: scam cards, one-use consent</text>
  <text x="358" y="468" font-size="15" fill="#1d2a1f">screen: cards in memory, family pages</text>
  <text x="358" y="490" font-size="15" fill="#1d2a1f">English and Spanish</text>
  <line x1="466" y1="180" x2="466" y2="260" stroke="#4c5d4f" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="318" y1="316" x2="340" y2="316" stroke="#4c5d4f" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>

  <rect x="68" y="384" width="250" height="148" rx="8" fill="#f4f7f1" stroke="#2f6f5e" stroke-width="2"/>
  <text x="84" y="410" font-size="16" font-weight="700" fill="#1d2a1f">On this computer, offline</text>
  <text x="84" y="434" font-size="15" fill="#1d2a1f">NVIDIA Cosmos Reason 2: eyes</text>
  <text x="84" y="456" font-size="15" fill="#1d2a1f">when the cloud's don't answer</text>
  <text x="84" y="478" font-size="15" fill="#1d2a1f">Vosk: the wake phrase</text>
  <text x="84" y="500" font-size="15" fill="#1d2a1f">Tesseract: reads the letter</text>
  <text x="84" y="522" font-size="15" fill="#1d2a1f">YuNet: finds a face to follow</text>
  <line x1="340" y1="458" x2="320" y2="458" stroke="#4c5d4f" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>

  <rect x="48" y="560" width="280" height="104" rx="10" fill="#24304f"/>
  <text x="188" y="604" font-size="20" font-weight="700" text-anchor="middle" fill="#f3d78f">The screen beside Andy</text>
  <text x="188" y="632" font-size="15" text-anchor="middle" fill="#c9cfe0">the day, what Andy found, captions</text>
  <line x1="400" y1="534" x2="250" y2="558" stroke="#4c5d4f" stroke-width="2" marker-end="url(#a)"/>

  <line x1="520" y1="534" x2="520" y2="558" stroke="#4c5d4f" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <rect x="356" y="560" width="280" height="104" rx="10" fill="#fff" stroke="#2f6f5e" stroke-width="2"/>
  <text x="496" y="600" font-size="18" font-weight="700" text-anchor="middle" fill="#1d2a1f">Family, on a phone</text>
  <text x="496" y="626" font-size="15" text-anchor="middle" fill="#4c5d4f">sees only what was shared;</text>
  <text x="496" y="646" font-size="15" text-anchor="middle" fill="#4c5d4f">sends messages and photos</text>

  <!-- the cloud -->
  <rect x="700" y="24" width="476" height="652" rx="14" fill="#eef0f7" stroke="#c9cfe0"/>
  <text x="720" y="60" font-size="22" font-weight="700" fill="#24304f">Nebius and the web</text>

  <rect x="724" y="84" width="428" height="128" rx="10" fill="#fff" stroke="#24304f" stroke-width="2"/>
  <text x="744" y="116" font-size="18" font-weight="700" fill="#24304f">Nebius Token Factory</text>
  <text x="744" y="142" font-size="15" fill="#24304f">Nemotron 3.5 Lightning: talk and tools, 0.6–0.8 s;</text>
  <text x="744" y="164" font-size="15" fill="#24304f">Super VL: eyes, zoomed in; Ultra: hard questions</text>
  <text x="744" y="190" font-size="15" fill="#4c5d4f">zero data retention on</text>

  <rect x="724" y="236" width="428" height="128" rx="10" fill="#fff" stroke="#24304f" stroke-width="2"/>
  <text x="744" y="268" font-size="18" font-weight="700" fill="#24304f">Nebius Serverless Endpoint</text>
  <text x="744" y="294" font-size="15" fill="#24304f">Nemotron 3.5 Content Safety: a second look</text>
  <text x="744" y="316" font-size="15" fill="#24304f">Nano 12B v2 VL: other eyes, if chosen</text>
  <text x="744" y="342" font-size="15" fill="#4c5d4f">an L40S; a token required; stopped when idle</text>

  <rect x="724" y="388" width="428" height="128" rx="10" fill="#fff" stroke="#24304f" stroke-width="2"/>
  <text x="744" y="420" font-size="18" font-weight="700" fill="#24304f">Nebius Serverless Jobs</text>
  <text x="744" y="446" font-size="15" fill="#24304f">The conversation suite and the scam check,</text>
  <text x="744" y="468" font-size="15" fill="#24304f">judged by NVIDIA Nemotron 3 Ultra;</text>
  <text x="744" y="494" font-size="15" fill="#4c5d4f">Andy's search in simulation; failures published</text>

  <rect x="724" y="540" width="428" height="110" rx="10" fill="#fff" stroke="#24304f" stroke-width="2"/>
  <text x="744" y="572" font-size="18" font-weight="700" fill="#24304f">Tavily</text>
  <text x="744" y="598" font-size="15" fill="#24304f">news, look-ups, research streamed to the</text>
  <text x="744" y="620" font-size="15" fill="#24304f">screen, links, what's on, scam warnings</text>

  <path d="M260 262 C 270 205, 600 200, 722 160" fill="none" stroke="#4c5d4f" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="636" y1="330" x2="722" y2="300" stroke="#4c5d4f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="636" y1="400" x2="722" y2="594" stroke="#4c5d4f" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
</svg>
