name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.20'
          enable-cache: true
      - name: Install SDK build and GStreamer introspection support
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2-dev libgirepository1.0-dev python3-dev pkg-config gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0
      - run: uv sync --project robot --locked
      - name: Load real SDK configuration and exercise the dispatcher without hardware
        run: uv run --project robot --with pytest python -m pytest tests/test_startup_config.py tests/test_confirmation_dispatch.py tests/test_suite_tools.py -q
  cpu-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.20'
          enable-cache: true
      - run: uv sync --locked
      - name: Install letter-reading support
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
      - run: uv run --locked pytest -q
      - name: Verify the installed distribution outside the checkout
        run: |
          uv build --wheel
          uv run --isolated --no-project --with dist/andy_companion-0.1.0-py3-none-any.whl python -I tests/test_distribution.py
