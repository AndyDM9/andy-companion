name: Ask to see Andy live
description: Free live robot demonstration or organiser hardware-access request through 2026-12-23.
title: "Live demo request"
labels: ["live demo"]
body:
  - type: markdown
    attributes:
      value: |
        Ask for a free live robot demonstration or coordinate an organiser's physical hardware-access request.
        Say your time zone and what you'd like to test (the letter, the glasses, a look-up, the family page).
        We can coordinate a time here; contact, call and any delivery details should go privately through the organisers.
        This issue is public: please do not post email addresses, phone numbers, private links or credentials.
        A video call is offered for demonstrations; any requested physical-access method must be agreed separately.
  - type: dropdown
    id: request_kind
    attributes:
      label: Request type
      options:
        - Free live robot demonstration
        - Physical hardware access requested by organisers
    validations:
      required: false
  - type: textarea
    id: when
    attributes:
      label: When suits you (with your time zone)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you'd like to see
    validations:
      required: false
