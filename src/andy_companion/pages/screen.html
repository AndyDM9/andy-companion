<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andy</title>
<link rel="icon" href="data:,">
<style>
  /* Atkinson Hyperlegible (SIL Open Font License, fonts/OFL.txt), served by Andy itself: a font from
     Google would tell Google this household's address each time a page opens. */
  @font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400; font-display: swap; src: url("/fonts/atkinson-hyperlegible-400.woff2") format("woff2"); }
  @font-face { font-family: "Atkinson Hyperlegible"; font-weight: 700; font-display: swap; src: url("/fonts/atkinson-hyperlegible-700.woff2") format("woff2"); }
</style>
<style>
  /* Andy's screen, "Andy Glass": for a TV beside the robot, read from across the room by an older adult.
     A living scene (a slow aurora coloured by the time of day, or the family photo softly blurred) behind
     frosted glass cards, after Apple's Liquid Glass, but with every text colour at 7:1 or more against
     the worst case behind it (tests/test_screen_design.py), because legibility comes first.
     Motion carries meaning: cards rise in, findings arrive line by line, the state orb breathes while
     Andy listens or thinks. "Reduce motion", "reduce transparency" and the Calm screen setting give solid
     panels and stillness. Words for what Andy is doing; never the person's words.
     From Apple's Human Interface Guidelines and WWDC25 "Meet Liquid Glass" (research 2026-10-13): a
     specular edge lit from where the light is (here, the sun's path through the day: left in the
     morning, above at noon, right in the evening); bigger glass is thicker (deeper shadow, more blur);
     concentric corners (inner radius = outer radius - padding); a new card lights up from within as it
     arrives; the state pill flexes a little when Andy's state changes; tvOS safe margins; solid panels
     when the TV asks for more contrast. Not taken: glass behind running text (the captions stay solid:
     NN/g found text over glass the weak point of iOS 26), springs that overshoot, SVG refraction (no
     support on older TV browsers), and `inset` (Chromium 87; 2022 TVs run 85). */
  @property --light { syntax: "<angle>"; inherits: true; initial-value: 135deg; }
  :root {
    --ground: #dde8f2; --ink: #142339; --soft: #2f3f55; --mark: #1c5244; --panel: #f1f6fa; --rule: #c3d2df; --hush: #3c4c61;
    --glass: rgba(255, 255, 255, .68); --edge: rgba(255, 255, 255, .85); --shine: rgba(255, 255, 255, .9);
    --glow1: #ffd8b5; --glow2: #b9d5f4; --glow3: #c7ecd9; --glow-a: .75; --photo-a: .09; --orb: #1c5244; --shadow: rgba(40, 60, 90, .18);
    --r: 32px; --rim: .7; --light: 135deg;
    /* A warning (a scam's sign, a letter that asks for gift cards): a solid band and a warm wash, never glass. */
    --warn: #7a2e0c; --warn-on: #ffffff; --warn-wash: #fbeee2;
  }
  body[data-part="afternoon"] {
    --ground: #e1ebdc; --ink: #1d2a1f; --soft: #334335; --mark: #1c5244; --panel: #f2f6ef; --rule: #c7d5c1; --hush: #415243;
    --glass: rgba(255, 255, 255, .66); --glow1: #fff0c0; --glow2: #c4e6c6; --glow3: #bcdff0; --orb: #1c5244;
    --shadow: rgba(40, 70, 40, .16);
    --warn: #7a2e0c; --warn-on: #ffffff; --warn-wash: #fbeee2;
  }
  body[data-part="evening"] {
    --ground: #1c2543; --ink: #f6dc96; --soft: #dde2ee; --mark: #f6dc96; --panel: #2b3658; --rule: #4a5784; --hush: #c9d0e0;
    --glass: rgba(37, 48, 82, .66); --edge: rgba(255, 255, 255, .16); --shine: rgba(255, 255, 255, .22);
    --glow1: #4a5fa8; --glow2: #7b4d86; --glow3: #a0662f; --glow-a: .38; --photo-a: .14; --orb: #f6dc96; --shadow: rgba(0, 0, 0, .35);
    --warn: #f2c078; --warn-on: #2a1600; --warn-wash: #3b2a33;
  }
  body[data-part="night"] {
    --ground: #0b1020; --ink: #c7cfdd; --soft: #a9b3c6; --mark: #d8c38c; --panel: #151d36; --rule: #26314d; --hush: #a3adc1;
    --glass: rgba(18, 25, 48, .72); --edge: rgba(255, 255, 255, .08); --shine: rgba(255, 255, 255, .1);
    --glow1: #1e2c5a; --glow2: #2a2454; --glow3: #1d3b4a; --glow-a: .35; --photo-a: .09; --orb: #d8c38c; --shadow: rgba(0, 0, 0, .5);
    --rim: .45;
    --warn: #e9b26a; --warn-on: #241200; --warn-wash: #221a28;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--ground); color: var(--ink);
    font-family: "Atkinson Hyperlegible", "Verdana", sans-serif;
    display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100vh;
    padding: 5.6vh 5vw 5vh;       /* tvOS keeps 60 pt top and bottom, 80 at the sides, clear at 1080p */
  }
  body.ready { transition: background-color 2s, color 2s, --light 4s ease; }

  /* The scene: three soft lights drifting very slowly, or the family photo, blurred. */
  .scene { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .glow { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; opacity: var(--glow-a);
          filter: blur(8vmax); transition: background-color 2s; }
  .g1 { background: var(--glow1); left: -20vmax; top: -30vmax; }
  .g2 { background: var(--glow2); right: -25vmax; top: 10vmax; }
  .g3 { background: var(--glow3); left: 20vmax; bottom: -40vmax; }
  .backdrop { position: absolute; top: -6vmax; right: -6vmax; bottom: -6vmax; left: -6vmax; background-size: cover; background-position: center;
              filter: blur(5vmax) saturate(1.2); opacity: 0; transition: opacity 1.6s ease; }
  body.has-photo .backdrop { opacity: var(--photo-a); }
  @media (prefers-reduced-motion: no-preference) {
    body:not(.calm) .g1 { animation: drift1 95s ease-in-out infinite alternate; }
    body:not(.calm) .g2 { animation: drift2 110s ease-in-out infinite alternate; }
    body:not(.calm) .g3 { animation: drift3 125s ease-in-out infinite alternate; }
  }
  @keyframes drift1 { to { transform: translate(18vmax, 12vmax) scale(1.08); } }
  @keyframes drift2 { to { transform: translate(-16vmax, 14vmax) scale(.94); } }
  @keyframes drift3 { to { transform: translate(14vmax, -12vmax) scale(1.1); } }

  /* Glass: frosted, a fine edge, and a specular rim lit from where the light is (--light, set by the
     hour). Small glass is thin; big glass (.thick) is thicker: more blur, a deeper shadow. */
  .glass { position: relative; background: var(--glass); border: 1px solid var(--edge); border-radius: var(--r);
           box-shadow: inset 0 1px 0 var(--shine), 0 1.6vh 4vh var(--shadow);
           -webkit-backdrop-filter: blur(28px) saturate(160%); backdrop-filter: blur(28px) saturate(160%); }
  .glass::before { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: inherit;
                   padding: 1.5px; pointer-events: none; opacity: var(--rim);
                   background: linear-gradient(var(--light), var(--shine), transparent 34%, transparent 66%, var(--edge));
                   -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
                   -webkit-mask-composite: xor; mask-composite: exclude; }
  .glass.thick { box-shadow: inset 0 1px 0 var(--shine), 0 2.6vh 6.5vh var(--shadow);
                 -webkit-backdrop-filter: blur(40px) saturate(170%); backdrop-filter: blur(40px) saturate(170%); }
  .state.glass { box-shadow: inset 0 1px 0 var(--shine), 0 .8vh 2.2vh var(--shadow);
                 -webkit-backdrop-filter: blur(20px) saturate(150%); backdrop-filter: blur(20px) saturate(150%); }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass { background: var(--panel); } }
  @media (prefers-reduced-transparency: reduce) { .glass, .glass.thick, .state.glass { background: var(--panel); backdrop-filter: none; } }
  body.calm .glass { background: var(--panel); backdrop-filter: none; -webkit-backdrop-filter: none; }
  /* More contrast asked for: solid panels with a clear outline, no rim, no scene. */
  @media (prefers-contrast: more) {
    .glass, .glass.thick, .state.glass { background: var(--panel); backdrop-filter: none; -webkit-backdrop-filter: none;
                                         border: 2px solid var(--ink); }
    .glass::before, .scene { display: none; }
  }

  /* The clock: day, then the part of the day, the time and the date. */
  .clock { padding-bottom: 2.6vh; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 3vw; align-items: start; }
  /* One steady size: the clock used to shrink and grow whenever a card came or went, and looked as if
     the time kept shifting (the founder, 2026-10-14). */
  .day { grid-column: 1; font-size: clamp(54px, 8.5vw, 150px); font-weight: 700; line-height: .9; letter-spacing: -0.025em; margin: 0; }
  .when { grid-column: 1; font-size: clamp(24px, 2.9vw, 50px); margin: 1.4vh 0 0; color: var(--soft); font-variant-numeric: tabular-nums; }
  .when strong { color: var(--ink); font-weight: 700; }

  /* What Andy is doing: a glass pill with Andy itself drawn small (its round head, its two eyes, its two antennas)
     doing on the TV what the robot does in the room: antennas lifted while you speak, leaning together while it
     thinks, a small sway while it speaks, drooped and eyes shut when asleep (2026-10-20, the one bold thing on
     the screen: the robot's own body language, not decoration). Where its head is turned, under the words. */
  .state { grid-column: 2; grid-row: 1; justify-self: end; display: flex; align-items: center; gap: .6em;
           margin: .4vh 0 0; padding: .45em 1.15em .45em .6em; border-radius: 999px;
           font-size: clamp(20px, 2.1vw, 38px); color: var(--ink); max-width: 38vw; }
  .state .words { display: flex; flex-direction: column; min-width: 0; line-height: 1.12; }
  .andy { flex: none; width: 1.75em; height: 1.75em; position: relative; color: var(--orb); }
  .andy svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .andy .head { fill: currentColor; }
  .andy .eye { fill: var(--panel); }
  .andy .ant line { stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; }
  .andy .ant circle { fill: currentColor; }
  .andy .ant, .andy .eyes { transform-box: view-box; }
  .andy .ant-l { transform-origin: 15px 16px; transform: rotate(-6deg); }
  .andy .ant-r { transform-origin: 25px 16px; transform: rotate(6deg); }
  .andy .eyes { transform-origin: 20px 25px; }
  .state[data-state="hearing"] .ant-l { transform: rotate(14deg); }              /* lifted, listening */
  .state[data-state="hearing"] .ant-r { transform: rotate(-14deg); }
  .state[data-state="thinking"] .ant-l, .state[data-state="working"] .ant-l { transform: rotate(18deg); }   /* leaning together */
  .state[data-state="thinking"] .ant-r, .state[data-state="working"] .ant-r { transform: rotate(18deg); }
  .state[data-state="quiet"] .ant-l, .state[data-state="asleep"] .ant-l { transform: rotate(-48deg); }      /* drooped */
  .state[data-state="quiet"] .ant-r, .state[data-state="asleep"] .ant-r { transform: rotate(48deg); }
  .state[data-state="asleep"] .eyes { transform: scaleY(.18); }                  /* eyes shut */
  .state[data-state="quiet"], .state[data-state="asleep"], .state[data-state="away"] { color: var(--soft); }
  .state[data-state="quiet"] .andy, .state[data-state="asleep"] .andy, .state[data-state="away"] .andy { color: var(--soft); }
  .state[data-state="away"] .andy { opacity: .6; }
  @media (prefers-reduced-motion: no-preference) {
    body:not(.calm) .andy .ant, body:not(.calm) .andy .eyes { transition: transform .7s cubic-bezier(.2, .8, .2, 1); }
    body:not(.calm) .state[data-state="thinking"] .ant, body:not(.calm) .state[data-state="working"] .ant { animation: ponder 2.4s ease-in-out infinite; }
    body:not(.calm) .state[data-state="speaking"] .ant-l { animation: sway-l 1.6s ease-in-out infinite; }
    body:not(.calm) .state[data-state="speaking"] .ant-r { animation: sway-r 1.6s ease-in-out infinite; }
    body:not(.calm) .state[data-state="ready"] .eyes { animation: blink 6s ease-in-out infinite; }
    body:not(.calm) .state[data-looking="wave"] .ant-l, body:not(.calm) .state[data-looking="wave"] .ant-r {
      animation: wave-ant .62s ease-in-out infinite alternate; }
    body:not(.calm) .state[data-state="speaking"] .andy::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0;
                                                                 border-radius: 50%; border: 2px solid var(--orb); animation: ring 1.6s ease-out infinite; }
    body:not(.calm) #state-label { transition: opacity .25s; }
    body:not(.calm) .state.flex { animation: flex .5s cubic-bezier(.2, .8, .2, 1); }
  }
  @keyframes flex { 40% { transform: scale(1.035); } }
  @keyframes ponder { 50% { transform: rotate(26deg); } }
  @keyframes sway-l { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(4deg); } }
  @keyframes sway-r { 0%, 100% { transform: rotate(6deg); } 50% { transform: rotate(-4deg); } }
  @keyframes wave-ant { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
  @keyframes blink { 0%, 94%, 100% { transform: none; } 97% { transform: scaleY(.15); } }
  @keyframes ring { from { transform: scale(.85); opacity: .7; } to { transform: scale(1.3); opacity: 0; } }

  /* Below the clock: two glass cards side by side; when Andy shows something they stack on the left. */
  /* The cards clip their own text; let their decorative shadows extend past the layout containers,
     so the shadows fade naturally instead of ending in hard lines. Keep the TV's content margins. */
  .below { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2.4vw;
           margin: 0 -5vw -4vh; padding: 2vh 5vw 4vh;
           align-content: start; min-height: 0; overflow: visible; }
  body.has-showing .below, body.has-photo .below { grid-template-columns: minmax(0, .82fr) minmax(0, 1.18fr); align-content: stretch; }
  /* A card is the thing to read: it takes most of the width, and the day's two cards keep to a narrow column. */
  body.has-showing .below { grid-template-columns: minmax(0, .6fr) minmax(0, 1.4fr); }
  /* Nothing to show and no photo: the two cards sit in the middle of the space below the clock, not at its top.
     Their row is as tall as they are but never taller than the space, so a long reminder or warning can't push
     them past its top and bottom (2026-10-25: centred and too tall, their tops were cut off); what's in them
     gives way a whole line at a time instead. */
  body:not(.has-showing):not(.has-photo) .below { align-content: center; grid-template-rows: minmax(0, auto); }
  body:not(.has-showing):not(.has-photo) .card { min-height: 0; overflow: hidden; }
  body:not(.has-showing):not(.has-photo) .next .what:not([hidden]) {
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  body:not(.has-showing):not(.has-photo) .weather .alert:not([hidden]) {
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  body:not(.has-showing):not(.has-photo) .weather .then:not([hidden]) {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .side { display: contents; }
  body.has-showing .side, body.has-photo .side { display: flex; flex-direction: column; gap: 2.4vh; min-width: 0; }
  .card { padding: 3vh 2.4vw; min-width: 0; }
  .label { font-size: clamp(19px, 1.9vw, 32px); color: var(--soft); margin: 0 0 1vh; letter-spacing: .01em; }

  .next .what { font-size: clamp(32px, 3.6vw, 64px); font-weight: 700; margin: 0; line-height: 1.12; }
  .next .at { font-size: clamp(24px, 2.6vw, 46px); margin: .8vh 0 0; color: var(--soft); font-variant-numeric: tabular-nums; }
  .next .at strong { color: var(--mark); font-weight: 700; }
  .later { list-style: none; margin: 2vh 0 0; padding: 0; }
  .later li { display: grid; grid-template-columns: 7.5ch 1fr; gap: 1vw; font-size: clamp(20px, 2vw, 34px); padding: .7vh 0;
              border-top: 1px solid var(--rule); color: var(--soft); }
  .later li.done { opacity: .6; }
  .later .t { font-variant-numeric: tabular-nums; }
  .empty { font-size: clamp(24px, 2.6vw, 44px); color: var(--soft); margin: 0; line-height: 1.3; }
  body.has-showing .next .what, body.has-photo .next .what { font-size: clamp(26px, 2.7vw, 48px); }
  body.has-showing .next .what { font-size: clamp(24px, 2.3vw, 42px); }
  body.has-showing .next .at { font-size: clamp(20px, 1.9vw, 34px); }
  body.has-showing .card { padding: 2.6vh 2vw; }
  body.has-showing .later, body.has-photo .later { display: none; }

  .weather .now { display: flex; align-items: baseline; gap: 1.2vw; margin: 0; flex-wrap: wrap; }
  .weather .deg { font-size: clamp(48px, 5.5vw, 100px); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .weather .sky { font-size: clamp(24px, 2.5vw, 44px); line-height: 1.2; }
  .weather .then { font-size: clamp(20px, 2vw, 34px); color: var(--soft); margin: 1.2vh 0 0; }
  .weather .alert { font-size: clamp(20px, 2vw, 34px); margin: 1.2vh 0 0; padding: .6vh 1vw; border-left: 6px solid var(--mark); }
  .weather .from { font-size: clamp(16px, 1.4vw, 24px); color: var(--hush); margin: 1vh 0 0; }
  body.has-showing .weather .deg, body.has-photo .weather .deg { font-size: clamp(36px, 3.6vw, 64px); }
  body.has-showing .weather .deg { font-size: clamp(32px, 3vw, 56px); }
  body.has-showing .weather .sky { font-size: clamp(20px, 1.9vw, 34px); }
  /* Beside a photo or a card, a long forecast ("Slight Chance Rain Showers then…") keeps to two lines. */
  body.has-showing .weather .sky, body.has-photo .weather .sky { display: -webkit-box; -webkit-line-clamp: 2;
                                                               -webkit-box-orient: vertical; overflow: hidden; }
  /* The row fits the screen and what's in it gives way, so nothing runs off the bottom (2026-10-25: a reminder over
     five lines and a long flood warning, beside a card, pushed both columns past the screen's edge). */
  body.has-showing .below, body.has-photo .below { grid-template-rows: minmax(0, 1fr); }
  /* Each card clips its own content; the column must let its rounded shadows reach the surrounding space. */
  body.has-showing .side, body.has-photo .side { min-height: 0; overflow: visible; }
  body.has-showing .side .card, body.has-photo .side .card { flex: 0 1 auto; min-height: 0; overflow: hidden; }
  body.has-showing .next .what:not([hidden]), body.has-photo .next .what:not([hidden]) {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  /* The time wraps rather than lose its end ("Tomorrow, 8:00 am · da…" in the narrow column, 2026-10-25). */
  body.has-showing .next .at:not([hidden]), body.has-photo .next .at:not([hidden]) {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  body.has-showing .weather .alert:not([hidden]), body.has-photo .weather .alert:not([hidden]) {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: clamp(18px, 1.6vw, 28px); }
  body.has-showing .weather .then, body.has-showing .weather .from,
  body.has-photo .weather .then, body.has-photo .weather .from { display: none; }

  /* What Andy found: one card that rises in; its lines arrive one after another. */
  /* A column: the list in the middle gives way first, so the kind, how it was found and the sources stay
     in view. How a web answer was found sits at the top beside the kind, where a caption never covers it. */
  .found { display: none; padding: 3.2vh 2.6vw; overflow: hidden; }
  body.has-showing .found { display: flex; flex-direction: column; }
  .found .top { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 1.4vw; row-gap: .3vh; flex: none; }
  .found .kind { font-size: clamp(18px, 1.7vw, 30px); color: var(--soft); margin: 0; }
  .found .how { font-size: clamp(16px, 1.4vw, 24px); color: var(--hush); margin: 0; }
  .found h2 { flex: none; }
  #items { flex: 0 1 auto; min-height: 0; overflow: hidden; }
  .found .source { flex: none; }
  .found h2 { font-size: clamp(28px, 3vw, 54px); line-height: 1.12; margin: .6vh 0 1.6vh; color: var(--ink); }
  .item { padding: 1.3vh 0; border-top: 1px solid var(--rule); }
  .item .title { font-size: clamp(22px, 2.2vw, 40px); font-weight: 700; margin: 0; line-height: 1.2; }
  .item .summary { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
                   font-size: clamp(19px, 1.8vw, 32px); margin: .5vh 0 0; line-height: 1.35; color: var(--soft); }
  /* A warning on a letter: the same mark as a weather alert, a bar at the start, never a red flash. */
  /* What to do, before the reasons (the scam receipt): the card's one instruction, in the ink colour and bold,
     on the panel itself, never over glass. */
  .found .lead { font-size: clamp(22px, 2.1vw, 38px); font-weight: 700; line-height: 1.25; color: var(--ink);
                 margin: -.6vh 0 1.4vh; }
  .item.caution { border-top: 0; border-left: 8px solid var(--mark); padding: 1.1vh 0 1.1vh 1.4vw; margin: .4vh 0 1vh; }
  .item.caution .summary { color: var(--ink); -webkit-line-clamp: 3; }
  /* A warning card (2026-10-20): it must look like one from across the room. The card is a solid warm wash, never
     glass; "Be careful" sits on a solid band with a mark, white on sienna by day, dark on amber at night (7:1,
     tests/test_round6_screen.py); what to do comes next, in bold. Warm, never a red flash. */
  .found.warn { background: var(--warn-wash); -webkit-backdrop-filter: none; backdrop-filter: none; }
  .found.warn .kind, .found.warn .how, .found.warn .source { color: var(--soft); }
  .found.warn-title h2, .item.caution:not(.step) { background: var(--warn); color: var(--warn-on);
                                                   border-radius: max(10px, calc(var(--r) - 1.6vw)); }
  .found.warn-title h2 { padding: 1.2vh 1.4vw; margin: .8vh 0 1.6vh; }
  .found.warn-title h2::before, .item.caution:not(.step) .title::before {
    content: "!"; display: inline-block; width: 1.15em; height: 1.15em; line-height: 1.15em; text-align: center; border-radius: 50%;
    background: var(--warn-on); color: var(--warn); font-weight: 700; margin-right: .45em; vertical-align: .06em; }
  .item.caution:not(.step) { border-left: 0; padding: 1.4vh 1.4vw; }
  .item.caution:not(.step) .title { font-size: clamp(26px, 2.6vw, 46px); color: var(--warn-on); }
  .item.caution:not(.step) .summary { color: var(--warn-on); font-size: clamp(21px, 2vw, 36px); }
  .item.caution.short2 .summary { -webkit-line-clamp: 2; }       /* beside a caption on a small screen */
  .item.caution.short1 .summary { -webkit-line-clamp: 1; }
  .item .when { font-size: clamp(17px, 1.5vw, 26px); color: var(--hush); margin: .5vh 0 0; }
  /* The scam check's receipt: why Andy said "be careful", as numbered steps (a real sequence: the sign, the
     warning, why they match), in the caution look; the number on a solid disc, never text over glass. */
  .item.step { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 1.3vw; align-items: start;
               border-left: 0; padding: 1vh 0; margin: 0; border-top: 1px solid var(--rule); }
  .item.step:first-child { border-top: 0; }
  .item.step .num { display: flex; align-items: center; justify-content: center; width: 1.7em; height: 1.7em; border-radius: 50%;
                    background: var(--mark); color: var(--panel); font-weight: 700; font-size: clamp(20px, 2vw, 36px);
                    font-variant-numeric: tabular-nums; }
  .item.step .title { font-size: clamp(18px, 1.7vw, 30px); color: var(--soft); }
  .item.step .summary { font-size: clamp(20px, 1.9vw, 34px); margin-top: .2vh; line-height: 1.3; }
  /* At its shortest a step is one line, its name and words together ("The sign: a relative in trouble…"),
     so all three steps fit above a caption while Andy speaks (step 3 names Nemotron Ultra: it must stay). */
  .item.step.short1 { align-items: start; padding: .6vh 0; }
  .item.step.short1 .num { width: 1.3em; height: 1.3em; font-size: clamp(17px, 1.6vw, 28px); }
  .item.step.short1 .title { font-size: clamp(17px, 1.5vw, 26px); }
  .item.step.short1 .summary { font-size: clamp(18px, 1.6vw, 29px); }
  /* Still too tall on a small screen: the warning's band and what to do get smaller, never the steps fewer. */
  .found.tight h2 { font-size: clamp(24px, 2.4vw, 44px); margin: .4vh 0 1vh; }
  .found.warn-title.tight h2 { padding: .8vh 1.2vw; }
  .found.tight .lead { font-size: clamp(19px, 1.75vw, 32px); margin-bottom: .8vh; }
  /* Never cut off mid-word (the judges came for this evidence): at its shortest a step wraps to two lines. */
  .item.step.short1 > :last-child { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-width: 0; }
  .item.step.short1 .title, .item.step.short1 .summary { display: inline; -webkit-line-clamp: unset; }
  .item.step.short1 .title::after { content: ": "; }
  /* What Andy looked at: the views in the order Andy turned, numbered (someone facing Andy has its left on
     their right, so "left" and "right" would mislead), the chosen one wider and ringed in the mark colour,
     where it is under it. 16:9 boxes by padding: Chromium 85 has no aspect-ratio. */
  .views { margin: .2vh 0 1.2vh; }
  .views .order { font-size: clamp(16px, 1.4vw, 24px); color: var(--hush); margin: 0 0 1.2vh; }
  .strip { display: flex; align-items: flex-start; gap: 1.1vw; }
  .view { flex: 1 1 0; min-width: 0; margin: 0; }
  /* With a view chosen: it large on the left; beside it where the thing is, in large type, and under that the
     other views in a row, each with its number on it and one line under it. The card is wide and short above
     the caption, so the chosen view gives way in width (--cw) and the words beside it gain the room. */
  .views.has-chosen .strip { gap: 1.8vw; }
  .views.has-chosen .view.chosen { flex: none; width: var(--cw, 56%); }
  .views .beside { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2vh; }
  .views .others { display: flex; gap: .9vw; }
  .views .others .view { flex: 0 1 calc((100% - 1.8vw) / 3); }
  .view .pic { position: relative; padding-top: 56.25%; border-radius: max(8px, calc(var(--r) - 2.6vw)); overflow: hidden;
               background: var(--rule); }
  .view .pic.none { background: transparent; }
  /* Draw the frame over the image, inside its box: outside shadows get cut by the card's item clipping. */
  .view .pic::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: inherit;
                      pointer-events: none; z-index: 1; }
  .view .pic.none::after { border: 2px dashed var(--rule); }
  .view img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .views.has-chosen .view:not(.chosen):not(.seen) img { opacity: .7; }
  .view.chosen .pic::after { border: 4px solid var(--mark); }
  .views .others .view.seen .pic::after { border: 2px solid var(--mark); }
  /* Each view's number on its own picture, so it never meets a neighbour's words. */
  .view .n { position: absolute; top: .35em; left: .35em; z-index: 1; display: flex; align-items: center; justify-content: center;
             width: 1.7em; height: 1.7em; border-radius: 50%; font-size: clamp(15px, 1.35vw, 24px); font-weight: 700;
             font-variant-numeric: tabular-nums; background: var(--panel); color: var(--ink); border: 2px solid var(--soft); }
  .views .others .view .n { font-size: clamp(14px, 1.05vw, 19px); }
  .view.chosen .n, .views .others .view.seen .n { background: var(--mark); border-color: var(--mark); color: var(--panel); }
  .view figcaption { margin: .9vh 0 0; font-size: clamp(16px, 1.45vw, 26px); color: var(--soft);
                     white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .views .others figcaption { font-size: clamp(14px, 1.1vw, 20px); }
  .view.seen figcaption { color: var(--mark); font-weight: 700; }
  .views .where { margin: 0; font-size: clamp(24px, 2.4vw, 44px); font-weight: 700; line-height: 1.2; color: var(--ink);
                  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .found .source { font-size: clamp(17px, 1.5vw, 26px); color: var(--hush); margin: 1.4vh 0 0; }
  .found .item a { color: inherit; text-decoration: underline; text-decoration-thickness: .08em; text-underline-offset: .18em; }
  /* While Andy speaks the caption lies over the foot of the screen: the card keeps its own foot clear of
     it (three caption lines and their padding), and its list gives way instead. Not beside the settings
     code, where the caption keeps to the left column. */
  body.has-caption:not(.showing-code) .found { padding-bottom: calc(var(--cap-block) + 2.4vh); }
  /* ... and so do the day's cards beside it: a card that no longer fits steps aside whole (fitCards). */
  body.has-caption.has-showing:not(.showing-code) .side, body.has-caption.has-photo .side,
  body.has-caption.has-photo .family {    /* the photo shrinks, its "From …" line stays readable (2026-10-28 review) */
    padding-bottom: calc(var(--cap-block) + 2.4vh); }
  /* The weather is on the big card: the small one beside it would only say it again. */
  body.showing-weather #weather { display: none; }
  /* A weather alert on the big card: the small card's calm bar, never the warning look. */
  .item.notice { border-left: 6px solid var(--mark); padding-left: 1.2vw; }
  .item.notice .summary { color: var(--ink); }
  /* Each period on one line when it fits ("Tonight · 78°  Showers, 80% rain"), so all of them stay beside a caption. */
  body.showing-weather .found .item:not(.notice) { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 1.2vw; }
  body.showing-weather .found .item:not(.notice) .summary { margin: 0; }
  .photo { display: block; max-width: 100%; max-height: 50vh; margin: 0 0 1.5vh; border-radius: max(10px, calc(var(--r) - 2.6vw)); object-fit: contain; }
  .qr { display: block; width: min(38vh, 100%); height: auto; margin: 0 auto 2vh; border-radius: max(10px, calc(var(--r) - 2.6vw)); background: #fff; padding: 1vh; }
  .qr-note { font-size: clamp(22px, 2.2vw, 38px); margin: 0; line-height: 1.3; }
  @media (prefers-reduced-motion: no-preference) {
    body:not(.calm) .enter { animation: rise .6s cubic-bezier(.2, .8, .2, 1) both; }
    body:not(.calm) .enter .item, body:not(.calm) .enter .source, body:not(.calm) .enter .qr, body:not(.calm) .enter .photo {
      animation: rise .5s cubic-bezier(.2, .8, .2, 1) both; }
    body:not(.calm) .enter .item:nth-of-type(1) { animation-delay: .18s; }
    body:not(.calm) .enter .item:nth-of-type(2) { animation-delay: .3s; }
    body:not(.calm) .enter .item:nth-of-type(3) { animation-delay: .42s; }
    body:not(.calm) .enter .source { animation-delay: .55s; }
    /* The views arrive one by one, in the order Andy turned to them. */
    body:not(.calm) .enter .view { animation: rise .5s cubic-bezier(.2, .8, .2, 1) both; }
    body:not(.calm) .enter .view:nth-child(2) { animation-delay: .15s; }
    body:not(.calm) .enter .view:nth-child(3) { animation-delay: .3s; }
    body:not(.calm) .enter .view:nth-child(4) { animation-delay: .45s; }
    body:not(.calm) .enter::before { animation: lit 1.8s ease-out both; }   /* lit from within as it arrives */
  }
  @keyframes lit { from { opacity: 1; } to { opacity: var(--rim); } }
  @keyframes rise { from { opacity: 0; transform: translateY(2.4vh) scale(.985); } to { opacity: 1; transform: none; } }

  /* When Andy is idle: a family photo in a glass frame, three minutes each, a slow cross-fade. */
  .family { display: none; margin: 0; min-width: 0; min-height: 0; flex-direction: column; padding: 1.6vh; }
  body.has-photo .family { display: flex; }
  .family img { width: 100%; height: 100%; min-height: 0; flex: 1; object-fit: cover; opacity: 1;
                 border-radius: calc(var(--r) - 1.6vh); }   /* concentric: the frame's radius less its padding */
  @media (prefers-reduced-motion: no-preference) { body:not(.calm) .family img { transition: opacity 1.5s ease; } }
  .family img.fading { opacity: 0; }
  .family figcaption { font-size: clamp(19px, 1.8vw, 32px); color: var(--soft); margin: 1.4vh .8vw .4vh; }
  .family figcaption b { color: var(--ink); font-weight: 700; }

  /* At night: only a calm clock (the time large, the day under it) and, if Andy speaks, its words. */
  body.is-night .below { display: none; }
  body.is-night .clock { align-self: center; }
  body.is-night .day { font-size: clamp(80px, 16vw, 280px); font-variant-numeric: tabular-nums; }
  body.is-night { grid-template-rows: minmax(0, 1fr) auto; }

  /* Captions: everything Andy says, three lines at a time at reading pace, laid over the foot of the
     screen like a TV's subtitles, so nothing on the screen moves when Andy starts or stops speaking and no
     empty band is kept for them. Andy's words only, never the person's. */
  :root { --cap-size: clamp(26px, 2.9vw, 50px); --cap-block: calc(var(--cap-size) * 1.28 * 3 + 3vh); }
  :root { --ask-size: clamp(22px, 2.1vw, 38px); }
  /* Beside a card, two lines at a time, so the card keeps its evidence in view (paged the same way). */
  body.has-showing { --cap-block: calc(var(--cap-size) * 1.28 * 2 + 3vh); }
  body.has-showing .caption { -webkit-line-clamp: 2; }
  .caption { position: fixed; left: 5vw; right: 5vw; bottom: 5vh; z-index: 5; margin: 0; padding: 1.5vh 2.2vw; background: var(--ink); color: var(--ground); border-radius: var(--r);
             font-size: var(--cap-size); line-height: 1.28; align-self: end;
             display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
             box-shadow: 0 1.6vh 4vh var(--shadow); transition: opacity .3s; }
  body:not(.has-caption) .caption { visibility: hidden; opacity: 0; }
  /* The settings code is for scanning: while it is up, the caption keeps to the left column, never over it. */
  body.showing-code .caption { right: calc(5vw + (90vw - 2.4vw) * .59 + 2.4vw); font-size: clamp(20px, 1.9vw, 32px); }
  @media (prefers-reduced-motion: no-preference) { body:not(.calm).has-caption .caption { animation: rise .45s cubic-bezier(.2, .8, .2, 1) both; } }

  /* "Try asking": when the screen is quiet in the day and Andy is awake, one thing to say to it, changing every
     20 s, where the captions go (never with one); the cards keep clear of it. */
  .ask { position: fixed; left: 5vw; bottom: 5vh; z-index: 4; margin: 0; max-width: 90vw; display: none;
         padding: 1.1vh 1.8vw; border-radius: 999px; font-size: var(--ask-size); line-height: 1.3; color: var(--soft);
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ask b { color: var(--ink); font-weight: 700; }
  body.has-ask .ask { display: block; }
  body.has-ask .below { padding-bottom: calc(var(--ask-size) * 1.3 + 2.2vh + 5vh); }
  /* While Andy speaks over the day's two cards they keep clear of the caption too (its three lines), and what's
     in them gives way a whole line at a time (fitCards); seen on the robot's screen, 2026-10-25. */
  body.has-caption:not(.has-showing):not(.has-photo) .below { padding-bottom: calc(var(--cap-block) + 4vh + 2vh); }
  /* The gear: Andy's settings (the code for a phone) and Under the hood, from the TV or its remote. */
  .gear { grid-column: 2; grid-row: 2; justify-self: end; align-self: end; display: inline-flex; align-items: center; gap: .5em;
          margin: 0; padding: .45em .9em; border-radius: 999px; font: inherit; font-size: clamp(16px, 1.5vw, 26px);
          color: var(--soft); cursor: pointer; }
  .gear svg { width: 1.2em; height: 1.2em; }
  /* Where Andy's head is turned ("Looking at you"), from the behaviours that move it: under the state's words in
     the pill, in quiet type, so it belongs to Andy rather than floating by the gear (2026-10-20). */
  .row2 { grid-column: 2; grid-row: 2; justify-self: end; align-self: end; display: flex; align-items: center; gap: 1.2vw; }
  .looking { font-size: .58em; color: var(--soft); margin: .15em 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .looking:empty { display: none; }
  /* A ring a remote's user can see from the sofa. Chromium 85 (a 2022 TV) has no :focus-visible, so the ring
     is on :focus, and taken off only where a browser knows a mouse, not a key, put the focus there. */
  .gear:focus, .menu button:focus { outline: 4px solid var(--mark); outline-offset: 4px; }
  .gear:focus:not(:focus-visible), .menu button:focus:not(:focus-visible) { outline: none; }
  /* Behind the open menu, a dark scrim: nothing of the screen reads through behind the menu's words. */
  .scrim { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 9; background: rgba(4, 8, 18, .74); display: none; }
  body.menu-open .scrim { display: block; }
  .menu { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; width: min(640px, 90vw);
          padding: 4vh 3vw; display: none; flex-direction: column; gap: 2vh; }
  .menu.open { display: flex; }
  .help { width: min(1440px, 90vw); max-height: 90vh; overflow-y: auto; }
  .help > p { margin: 0; font-size: clamp(19px, 1.8vw, 29px); color: var(--soft); }
  .help-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.5vw; }
  .help-group { padding: 1.3vw; border: 2px solid var(--rule); border-radius: var(--r); background: var(--ground); }
  .help-group h3 { margin: 0 0 .8em; color: var(--mark); font-size: clamp(20px, 2vw, 32px); }
  .help-group p { margin: .8em 0 0; color: var(--ink); font-size: clamp(20px, 1.9vw, 31px); line-height: 1.3; }
  .search-views { display: flex; list-style: none; padding: 0; margin: 2vh 0; gap: 1vw; }
  .search-views li { flex: 1; border: 2px solid var(--soft); border-radius: .6em; padding: .55em; text-align: center;
                     font-size: clamp(23px, 2.8vw, 46px); color: var(--soft); }
  .search-views li.captured { color: var(--mark); border-color: var(--mark); border-width: 4px; font-weight: 700; }
  .search-count, .search-note { margin: 1vh 0; color: var(--soft); font-size: clamp(21px, 2vw, 34px); }
  @media (max-width: 900px) { .help-grid { grid-template-columns: 1fr; } .help-group { padding: 1em; } }

  .menu.glass { background: var(--panel); -webkit-backdrop-filter: none; backdrop-filter: none; }   /* solid: text behind text never */
  .menu h2 { margin: 0 0 1vh; font-size: clamp(26px, 2.6vw, 44px); color: var(--ink); }
  .menu button { font: inherit; font-size: clamp(20px, 2vw, 34px); padding: .7em 1em; border-radius: var(--r); text-align: left;
                 background: var(--ground); color: var(--ink); border: 2px solid var(--rule); cursor: pointer; }
  .menu button span { display: block; font-size: .7em; color: var(--soft); margin-top: .2em; }
  /* No word from Andy for about ten seconds: the time keeps running from the TV's own clock, what is below
     it dims (it may be out of date), and a plain notice says so, at the size of a card's label. */
  .below { transition: opacity .8s; }
  body.offline-on .below { opacity: .4; }
  body.offline-on .caption { visibility: hidden; }
  .offline { position: fixed; left: 50%; bottom: 5vh; transform: translateX(-50%); z-index: 6; margin: 0; max-width: 90vw;
             padding: .6em 1.3em; border-radius: 999px; background: var(--panel); color: var(--ink); border: 2px solid var(--rule);
             font-size: clamp(19px, 1.9vw, 32px); text-align: center; box-shadow: 0 1.6vh 4vh var(--shadow); display: none; }
  body.offline-on .offline { display: block; }
</style>

  function text(el, value) { el.textContent = value; return el; }
  // A reminder starts with a capital, as a list of things to do is written, whoever set it and however it was said.
  const sentence = (t) => (t ? t.charAt(0).toUpperCase() + t.slice(1) : t);
  function make(tag, cls, value) { const el = document.createElement(tag); if (cls) el.className = cls; return text(el, value || ""); }
  function linkTo(p, url) {

  // at a time (those done first, then the last), then the weather's later forecast and its source line.
  function fitCards() {
    const next = document.querySelector(".next"), weather = $("weather");
    const later = [...$("later").children], spare = [$("w-then"), $("w-from")];
    later.concat(spare, [weather]).forEach((el) => { el.style.display = ""; });
    const alert = $("w-alert"); alert.style.webkitLineClamp = "";
    const over = (card) => card.scrollHeight > card.clientHeight + 1;
    // Beside a card or a photo the weather steps aside whole when it no longer fits above the caption; Next stays.
    const side = document.querySelector(".side"), b = document.body.classList;
    if ((b.contains("has-showing") || b.contains("has-photo")) && !weather.hidden) {
      const floor = side.getBoundingClientRect().bottom - parseFloat(getComputedStyle(side).paddingBottom);
      if (over(weather) || weather.getBoundingClientRect().bottom > floor + 1) weather.style.display = "none";
      return;
    }
    const order = later.filter((li) => li.classList.contains("done"))
      .concat(later.filter((li) => !li.classList.contains("done")).reverse());
    for (const li of order) { if (!over(next)) break; li.style.display = "none"; }
    for (const el of spare.slice().reverse()) { if (!over(weather)) break; el.style.display = "none"; }
    for (const n of ["2", "1"]) { if (!over(weather)) break; alert.style.webkitLineClamp = n; }   // an alert stays, shorter
  }

  let familyId = "", foundKey = "", foundContent = "";
  // What Andy looked at when it searched for something: the views from the screen server's memory (two minutes),
  // numbered in the order Andy turned, the one it chose ringed and wider, where the thing is under it.
  const VIEW_KINDS = ["seen", "looked"];
  function viewStrip(v, showing) {
    const pick = v.chosen, wrap = make("div", "views" + (pick !== null ? " has-chosen" : "")), strip = make("div", "strip");
    const where = showing.kind === "seen" && showing.items[0] ? showing.items[0].summary || "" : "";
    const figs = v.pictures.map((has, i) => {
      const chosen = pick === i, seen = !!v.seen[i];
      const said = !has ? ui.noPicture : chosen ? ui.seenHere : seen ? ui.seenToo : ui.notSeen;
      const fig = make("figure", "view" + (chosen ? " chosen" : "") + (seen && has ? " seen" : ""));
      const pic = make("div", "pic" + (has ? "" : " none"));
      if (has) {
        const img = document.createElement("img");
        img.alt = `${ui.view} ${i + 1}: ${said}`;
        img.src = "/view?t=" + encodeURIComponent(token) + "&i=" + i + "&at=" + encodeURIComponent(v.at);
        img.onerror = () => img.remove();          // forgotten in the meantime: an empty frame, never a broken image
        pic.append(img);
      }
      pic.append(make("span", "n", String(i + 1)));
      fig.append(pic);
      if (!chosen) fig.append(make("figcaption", "", said));   // the chosen view's words are where the thing is
      return fig;
    });
    if (v.pictures.length > 1) wrap.append(make("p", "order", ui.order));
    if (pick === null) strip.append(...figs);
    else {
      const beside = make("div", "beside"), others = make("div", "others");
      beside.append(make("p", "where", where || ui.seenHere));
      figs.forEach((fig, i) => { if (i !== pick) others.append(fig); });
      if (others.children.length) beside.append(others);
      strip.append(figs[pick], beside);
    }
    wrap.append(strip);
    return wrap;
  }
  function showFamilyPhoto(fp) {
    const cap = $("family-cap"); cap.textContent = "";
    if (fp.sample) cap.append(fp.caption);       // a sample landscape: only its credit
    else cap.append(make("b", "", `${ui.from} ${fp.name || ui.family}`), ` · ${fp.when}` + (fp.caption ? ` · ${fp.caption}` : ""));
    if (fp.photo === familyId) return;
    familyId = fp.photo;
    const img = $("family-img");
    const src = "/photo?t=" + encodeURIComponent(token) + "&id=" + encodeURIComponent(fp.photo);
    img.alt = fp.caption || (ui.from + " " + (fp.name || ui.family));
    $("backdrop").style.backgroundImage = `url("${src}")`;       // the same photo, blurred, behind the glass
    if (!img.getAttribute("src")) { img.src = src; return; }
    img.classList.add("fading");
    setTimeout(() => { img.src = src; img.onload = () => img.classList.remove("fading"); }, 900);
  }

  function lightAngle(hhmm) {
    // The light on the glass follows the sun across the day: from the left in the morning (100°), from
    // above at noon (180°), from the right in the evening (260°); from above, dimmer, at night.
    const [h, m] = hhmm.split(":").map(Number);
    const hour = h + m / 60;
    if (hour < 6 || hour >= 21) return 180;
    return Math.round(100 + (Math.min(hour, 18) - 6) / 12 * 160);
  }

  let capText = "", capSeenAt = 0, capPages = [], capChars = 0;
  let pageVersion = 0;
  const READ_CPS = 15;                          // about Andy's speaking pace
  // How many characters fit three lines of the caption as it is now laid out on this TV, with room spare:
  // Atkinson Hyperlegible's letters average a little over half their size in width.
  function pageChars() {
    const el = $("caption"), cs = getComputedStyle(el);
    const width = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const perLine = width / (parseFloat(cs.fontSize) * 0.56);
    const lines = document.body.classList.contains("has-showing") ? 2 : 3;
    return Math.max(40, Math.floor(perLine * lines * 0.85));
  }
  // Where a long sentence breaks between pages: after a comma, colon or dash in the page's second half, else between
  // words, never between a word and the number after it (2026-10-25: a page began "26 at 9:00 AM ET: …").
  function pauseAt(sentence, max) {
    const head = sentence.slice(0, max + 1);
    const pauses = [...head.matchAll(/[,;:\u2013\u2014]\s/g)].map((m) => m.index + 1).filter((i) => i >= max / 2);
    if (pauses.length) return pauses[pauses.length - 1];
    let cut = head.lastIndexOf(" ");
    while (cut > max / 2 && /\d/.test(sentence.charAt(cut + 1))) cut = sentence.lastIndexOf(" ", cut - 1);
    return cut > 0 ? cut : max;
  }
  function captionPages(text) {
    const PAGE_CHARS = pageChars();
    const sentences = (text.match(/[^.!?¡¿]+[.!?]*/g) || []).map((x) => x.trim()).filter(Boolean);
    const pages = [];
    let cur = "";
    for (let sentence of sentences) {
      while (sentence.length > PAGE_CHARS) {          // a very long sentence is split where it pauses
        const cut = pauseAt(sentence, PAGE_CHARS);
        if (cur) { pages.push(cur); cur = ""; }
        pages.push(sentence.slice(0, cut).trim());
        sentence = sentence.slice(cut).trim();
      }
      if (cur && (cur + " " + sentence).length > PAGE_CHARS) { pages.push(cur); cur = sentence; }
      else cur = cur ? cur + " " + sentence : sentence;
    }
    if (cur) pages.push(cur);
    return pages;
  }
  function captionLasts() {
    return capPages.reduce((sum, page) => sum + Math.max(2.5, page.length / READ_CPS), 0);
  }
  function captionNow(now) {
    let t = (now - capSeenAt) / 1000;
    for (const page of capPages) {
      const lasts = Math.max(2.5, page.length / READ_CPS);
      if (t < lasts) return page;
      t -= lasts;
    }
    return capPages[capPages.length - 1] || "";
  }
  // "How Andy found this": which Tavily calls, their depth, the time and the credits Tavily reported.
  function howLine(showing) {
    const h = showing.how;
    if (!h || !h.calls || !h.calls.length) return "";
    const names = [...new Set(h.calls)].map((c) => ui.calls[c] || c);
    const what = names.length > 1 ? names.slice(0, -1).join(", ") + ` ${ui.and} ` + names[names.length - 1] : names[0];
    const lang = document.documentElement.lang || "en";
    const secs = Number(h.seconds || 0).toLocaleString(lang, { maximumFractionDigits: 1 }) + " s";
    const parts = [`${ui.how}: ${what}` + (h.depth ? ` (${h.depth})` : ""),
                   showing.kind === "research" ? `${secs} ${ui.howSoFar}` : secs];
    if (typeof h.credits === "number") parts.push(`${h.credits} ${h.credits === 1 ? ui.credit : ui.credits}`);
    if (typeof h.sites === "number" && h.sites > 0) parts.push(`${h.sites} ${h.sites === 1 ? ui.site : ui.sites}`);
    return parts.join(", ");
  }
  function clock12(hhmm) {
    let [h, m] = hhmm.split(":").map(Number);
    const ampm = h < 12 ? "am" : "pm"; h = h % 12 || 12;
    return h + ":" + String(m).padStart(2, "0") + " " + ampm;
  }
  // One request at a time, given up after five seconds, so a dead connection doesn't pile them up.
  let ticking = false, lastOk = performance.now(), connectionGeneration = 0;
  async function tick() {
    if (ticking) return;
    ticking = true;
    const ctl = window.AbortController ? new AbortController() : null;
    const timer = ctl ? setTimeout(() => ctl.abort(), 5000) : 0;
    try {
      const r = await fetch("/api/screen?t=" + encodeURIComponent(token), { cache: "no-store", signal: ctl ? ctl.signal : undefined });
      if (!r.ok) throw new Error(r.status);
      const data = await r.json();
      if (data.links && data.links.hood) hoodLink = data.links.hood;
      render(data);
      lastOk = performance.now();
      setOffline(false);
    } catch (e) { /* everySecond() says so after ten seconds without an answer */ }
    finally { clearTimeout(timer); ticking = false; }
  }
  // About ten seconds without Andy: the lower area dims, the state pill goes to its "away" look, and the
  // notice shows. The clock goes on from the server's time it last learned.
  const OFFLINE_AFTER_MS = 10000;
  function setOffline(on) {
    if (document.body.classList.contains("offline-on") === on) return;
    connectionGeneration++;                       // replies from before this transition are stale
    document.body.classList.toggle("offline-on", on);
    if (on) {
      const pill = $("state");
      pill.dataset.state = "away"; text($("state-label"), ui.lost);
      lastState = "";                             // the real state comes back with the connection
    }
  }
  function everySecond() {
    renderClock();
    showAsk();
    if (performance.now() - lastOk > OFFLINE_AFTER_MS) setOffline(true);
  }

  // "Try asking" (PLAN B25): only when nothing is on the screen, no caption, not the night clock, the menu
  // closed, and Andy awake and waiting, so whatever it suggests can be said at once.
  let liveNow = "";
  function showAsk() {
    const b = document.body.classList;
    const on = !!(lastS && lastS.hints && !lastS.showing && !lastS.night) && liveNow === "ready"
               && !b.contains("has-caption") && !b.contains("menu-open") && !b.contains("offline-on");
    b.toggle("has-ask", on);
    if (!on || !ui.ask) return;
    text($("ask-label"), ui.ask.label);
    const what = ui.ask.list[Math.floor(Date.now() / 20000) % ui.ask.list.length];
    if ($("ask-what").textContent !== what) text($("ask-what"), what);
  }

  // The state strip changes in a moment, so it is asked for more often than the rest of the screen.
  let lastState = "", lastSpoke = 0, stateTicking = false;
  async function stateTick() {
    if (stateTicking || document.body.classList.contains("offline-on")) return;
    stateTicking = true;
    const generation = connectionGeneration;
    const ctl = window.AbortController ? new AbortController() : null;
    const timer = ctl ? setTimeout(() => ctl.abort(), 5000) : 0;
    try {
      const r = await fetch("/api/state?t=" + encodeURIComponent(token), { cache: "no-store", signal: ctl ? ctl.signal : undefined });
      if (!r.ok) return;
      const s = await r.json();
      if (generation !== connectionGeneration || document.body.classList.contains("offline-on")) return;
      if (s.state === "speaking") lastSpoke = Date.now();
      if (s.state !== liveNow) { liveNow = s.state; showAsk(); }
      text($("looking"), (ui.looking && ui.looking[s.looking]) || "");
      $("state").dataset.looking = s.looking || "";      // Andy's drawing waves its antennas when it waves back
      const key = s.state + "|" + s.label;
      if (key === lastState) return;
      const pill = $("state");
      if (lastState) { pill.classList.remove("flex"); void pill.offsetWidth; pill.classList.add("flex"); }   // a small flex as it changes
      lastState = key;
      pill.dataset.state = s.state;
      text($("state-label"), s.label);
    } catch (e) { /* the reconnecting notice covers this */ }
    finally { clearTimeout(timer); stateTicking = false; }
  }
  // The gear: a menu for the TV's remote or a mouse. Nothing has focus when the page opens, so the first arrow
  // or OK puts it on the gear; in the menu, arrows and Tab go round its buttons, and Back closes it.
  let helpLanguage = "";
  function renderHelp() {
    const lg = document.documentElement.lang;
    if (helpLanguage === lg) return;
    helpLanguage = lg;
    text($("help-open"), ui.help.button); text($("help-h"), ui.help.title);
    text($("help-intro"), ui.help.intro); text($("help-controls"), ui.help.controls); text($("help-close"), ui.close);
    const grid = $("help-grid"); grid.textContent = "";
    for (const [title, ...examples] of ui.help.groups) {
      const section = make("section", "help-group"); section.append(make("h3", "", title));
      for (const example of examples) section.append(make("p", "", "“" + example + "”"));
      grid.append(section);
    }
  }
  function openHelp(open) {
    $("help").classList.toggle("open", open);
    document.body.classList.toggle("menu-open", open);
    if (open) { $("menu").classList.remove("open"); $("help").focus(); $("help").scrollTop = 0; } else $("help-open").focus();
    showAsk();
  }
  $("help-open").addEventListener("click", () => openHelp(true));
  $("help-close").addEventListener("click", () => openHelp(false));
  function openMenu(open) {
    $("menu").classList.toggle("open", open);
    document.body.classList.toggle("menu-open", open);
    if (open) { $("help").classList.remove("open"); $("menu-code").focus(); } else $("gear").focus();
    showAsk();
  }
  $("gear").addEventListener("click", () => openMenu(true));
  $("menu-close").addEventListener("click", () => openMenu(false));
  $("scrim").addEventListener("click", () => { if ($("help").classList.contains("open")) openHelp(false); else openMenu(false); });
  // The hood page has its own token, learned from /api/screen; "from=screen" lets its Back key come back here.
  let hoodLink = "";
  $("menu-hood").addEventListener("click", () => { if (hoodLink) location.href = hoodLink + "&from=screen"; });
  $("menu-code").addEventListener("click", async () => {
    try { await fetch("/api/screen/settings-code?t=" + encodeURIComponent(token), { method: "POST" }); } catch (e) {}
    openMenu(false);
    tick();
  });
  const ARROWS = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"];
  // Back on a TV remote: Escape or Backspace in most browsers; LG's and Samsung's TVs send their own codes.
  const isBack = (e) => ["Escape", "Backspace", "GoBack", "BrowserBack"].includes(e.key) || e.keyCode === 461 || e.keyCode === 10009;
  document.addEventListener("keydown", (e) => {
    const helpOpen = $("help").classList.contains("open");
    const menu = helpOpen ? $("help") : $("menu");
    if (!menu.classList.contains("open")) {
      const a = document.activeElement;
      if ((!a || a === document.body || a === document.documentElement) && (ARROWS.includes(e.key) || e.key === "Enter")) {
        $("gear").focus(); e.preventDefault();
      } else if (ARROWS.includes(e.key)) {
        const controls = [$("help-open"), $("gear")], i = controls.indexOf(a);
        if (i >= 0) { controls[1 - i].focus(); e.preventDefault(); }
      }
      return;
    }
    const buttons = [...menu.querySelectorAll("button")], n = buttons.length;
    const i = buttons.indexOf(document.activeElement);
    const next = i < 0 ? 0 : (i + 1) % n, prev = i < 0 ? n - 1 : (i - 1 + n) % n;
    if (isBack(e)) { if (helpOpen) openHelp(false); else openMenu(false); e.preventDefault(); }
    else if (helpOpen && ["ArrowUp", "ArrowDown"].includes(e.key)) {
      menu.scrollTop += (e.key === "ArrowDown" ? 1 : -1) * menu.clientHeight * .6; e.preventDefault();
    }
    else if (e.key === "Tab") { buttons[e.shiftKey ? prev : next].focus(); e.preventDefault(); }   // focus stays in the menu
    else if (e.key === "ArrowDown" || e.key === "ArrowRight") { buttons[next].focus(); e.preventDefault(); }
    else if (e.key === "ArrowUp" || e.key === "ArrowLeft") { buttons[prev].focus(); e.preventDefault(); }
  });
  tick(); setInterval(tick, 1000);
  setInterval(everySecond, 1000);
  stateTick(); setInterval(stateTick, 400);
</script>
</body>
</html>
